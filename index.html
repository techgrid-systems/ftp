<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Repository Manager</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 { margin-top: 0; margin-bottom: 20px; font-size: 20px; }
        .config-box {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .config-box input { grid-column: span 2; }
        input, button {
            background: #0f172a;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus { outline: 2px solid var(--accent); }
        button {
            background-color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .breadcrumb {
            margin-bottom: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        .breadcrumb span { cursor: pointer; color: #60a5fa; }
        .breadcrumb span:hover { text-decoration: underline; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { font-weight: 600; color: #94a3b8; font-size: 13px; text-transform: uppercase; }
        .file-row { cursor: pointer; }
        .file-row:hover { background-color: rgba(255,255,255,0.03); }
        .actions { display: flex; gap: 8px; }
        .btn-danger { background-color: #ef4444; }
        .btn-danger:hover { background-color: #dc2626; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>📁 Web Repository Manager</h2>

    <!-- Connection Setup -->
    <div class="config-box" id="configSection">
        <input type="text" id="repoOwner" placeholder="GitHub Username / Organization">
        <input type="text" id="repoName" placeholder="Repository Name">
        <input type="password" id="repoToken" placeholder="GitHub Personal Access Token (Repo Scope)">
        <button onclick="initManager()" style="grid-column: span 2;">Connect to Repository</button>
    </div>

    <!-- Main File Manager UI (Hidden until connected) -->
    <div id="managerInterface" style="display: none;">
        <div class="toolbar">
            <input type="text" id="newFolderName" placeholder="New folder name...">
            <button onclick="createFolder()">Create Folder</button>
            
            <input type="file" id="fileInput" style="display: none;" onchange="uploadFile(event)">
            <button onclick="document.getElementById('fileInput').click()">Upload Document</button>
            
            <button onclick="logout()" style="background: #475569; margin-left: auto;">Disconnect</button>
        </div>

        <div class="breadcrumb" id="breadcrumb">Current Path: <span>/</span></div>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="fileList">
                <!-- Populated dynamically -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let OWNER = "";
    let REPO = "";
    let TOKEN = "";
    let BRANCH = "main";
    let currentPath = "";

    function initManager() {
        OWNER = document.getElementById("repoOwner").value.trim();
        REPO = document.getElementById("repoName").value.trim();
        TOKEN = document.getElementById("repoToken").value.trim();

        if (!OWNER || !REPO || !TOKEN) {
            alert("Please fill in all connection fields.");
            return;
        }

        document.getElementById("configSection").style.display = "none";
        document.getElementById("managerInterface").style.display = "block";
        fetchContents();
    }

    function logout() {
        document.getElementById("configSection").style.display = "grid";
        document.getElementById("managerInterface").style.display = "none";
        currentPath = "";
    }

    async function fetchContents(path = "") {
        const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`;
        try {
            const response = await fetch(url, {
                headers: { "Authorization": `Bearer ${TOKEN}`, "Accept": "application/vnd.github+json" }
            });
            if (!response.ok) throw new Error("Failed to fetch path contents.");
            const data = await response.json();
            renderFileList(Array.isArray(data) ? data : [data]);
        } catch (error) {
            console.error(error);
            alert("Could not load directory. Check your credentials or branch name.");
        }
    }

    function renderFileList(items) {
        const fileList = document.getElementById("fileList");
        fileList.innerHTML = "";

        if (currentPath !== "") {
            let parentPath = currentPath.split("/").slice(0, -1).join("/");
            fileList.innerHTML += `
                <tr class="file-row" onclick="navigateTo('${parentPath}')">
                    <td>📁 ..</td>
                    <td>Directory</td>
                    <td>-</td>
                </tr>`;
        }

        items.forEach(item => {
            // Hide the internal .gitkeep placeholder file from showing up in the UI list
            if (item.name === ".gitkeep") return;

            let isDir = item.type === "dir";
            let icon = isDir ? "📁" : "📄";
            let typeLabel = isDir ? "directory" : "file";
            
            let rowHtml = `
                <tr class="file-row">
                    <td onclick="${isDir ? `navigateTo('${item.path}')` : `window.open('${item.download_url}', '_blank')`}">
                        ${icon} ${item.name}
                    </td>
                    <td>${typeLabel}</td>
                    <td class="actions">
                        <button class="btn-danger" onclick="deleteItem('${item.path}', '${item.sha}', '${typeLabel}')">Delete</button>
                    </td>
                </tr>
            `;
            fileList.innerHTML += rowHtml;
        });

        document.getElementById("breadcrumb").innerHTML = `Current Path: <span onclick="navigateTo('')">/</span>${currentPath}`;
    }

    function navigateTo(path) {
        currentPath = path;
        fetchContents(currentPath);
    }

    async function createFolder() {
        let folderName = document.getElementById("newFolderName").value.trim();
        if (!folderName) return alert("Enter a folder name.");

        let targetPath = currentPath ? `${currentPath}/${folderName}/.gitkeep` : `${folderName}/.gitkeep`;
        let contentBase64 = btoa(""); 

        await commitToGitHub(targetPath, contentBase64, `Create folder: ${folderName}`);
        document.getElementById("newFolderName").value = "";
        fetchContents(currentPath);
    }

    async function uploadFile(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = async function(e) {
            let base64Content = btoa(
                new Uint8Array(e.target.result).reduce((data, byte) => data + String.fromCharCode(byte), '')
            );

            // Cleanly construct the file path whether at root or inside a subfolder
            let targetPath = currentPath ? `${currentPath}/${file.name}` : file.name;
            await commitToGitHub(targetPath, base64Content, `Upload document: ${file.name}`);
            fetchContents(currentPath);
            alert(`Uploaded ${file.name} successfully!`);
        };
        reader.readAsArrayBuffer(file);
    }

    async function commitToGitHub(path, contentBase64, message, sha = null) {
        let url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;
        
        let bodyData = { message: message, content: contentBase64, branch: BRANCH };

        // If file already exists at this path, grab its SHA so GitHub allows the update/overwrite
        try {
            let existingCheck = await fetch(url, {
                headers: { "Authorization": `Bearer ${TOKEN}` }
            });
            if (existingCheck.ok) {
                let existingData = await existingCheck.json();
                bodyData.sha = existingData.sha;
            }
        } catch (e) {}

        let response = await fetch(url, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${TOKEN}`, "Content-Type": "application/json" },
            body: JSON.stringify(bodyData)
        });

        if (!response.ok) {
            let err = await response.json();
            throw new Error(err.message || "GitHub action failed.");
        }
    }

    async function deleteItem(path, sha, type) {
        if (!confirm(`Are you sure you want to delete this ${type}?`)) return;

        let targetPath = path;
        if (type === "directory") {
            targetPath = path + "/.gitkeep";
            try {
                let res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${targetPath}`, {
                    headers: { "Authorization": `Bearer ${TOKEN}` }
                });
                if (res.ok) {
                    let d = await res.json();
                    sha = d.sha;
                }
            } catch(e) {}
        }

        let url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${targetPath}`;
        let response = await fetch(url, {
            method: "DELETE",
            headers: {
                "Authorization": `Bearer ${TOKEN}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: `Delete ${targetPath} via web manager`,
                sha: sha,
                branch: BRANCH
            })
        });

        if (response.ok) {
            alert("Deleted successfully!");
            fetchContents(currentPath);
        } else {
            alert("Failed to delete item.");
        }
    }
</script>

</body>
</html>
